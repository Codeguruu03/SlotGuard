# ─────────────────────────────────────────────────────────────────────────────
# SlotGuard — docker-compose.yml
#
# Defines the complete reproducible environment:
#   - slotguard-api   : Spring Boot application (H2 in-memory, no external DB needed)
#   - test-runner     : Maven automation test suite (runs after API is healthy)
#
# Usage:
#   docker compose up --build           # Start API only
#   docker compose --profile tests up   # Start API + run all tests
# ─────────────────────────────────────────────────────────────────────────────

version: "3.9"

services:

  # ───────────── SlotGuard Spring Boot API ─────────────
  slotguard-api:
    build:
      context: ./application
      dockerfile: Dockerfile
    container_name: slotguard-api
    ports:
      - "8080:8080"
    environment:
      # Use H2 in-memory DB (zero external dependencies)
      SPRING_DATASOURCE_URL: jdbc:h2:mem:slotguarddb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD: ""
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.h2.Driver
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.H2Dialect
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/slots"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - slotguard-net

  # ───────────── Automation Test Runner ─────────────
  # Profile: tests — only starts when --profile tests is specified
  test-runner:
    image: eclipse-temurin:17-jdk-alpine
    container_name: slotguard-test-runner
    profiles:
      - tests
    working_dir: /automation
    volumes:
      - ./automation:/automation
      - maven-cache:/root/.m2
    environment:
      BASE_URL: http://slotguard-api:8080
    command: >
      sh -c "
        echo '=== Waiting for SlotGuard API ===' &&
        until wget -qO- http://slotguard-api:8080/api/slots; do
          echo 'API not ready yet, retrying...' && sleep 3;
        done &&
        echo '=== SlotGuard API is READY ===' &&
        ./mvnw test -DbaseUrl=http://slotguard-api:8080 -q
      "
    depends_on:
      slotguard-api:
        condition: service_healthy
    networks:
      - slotguard-net

networks:
  slotguard-net:
    driver: bridge

volumes:
  maven-cache:
    driver: local
